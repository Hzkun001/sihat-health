# Supabase CLI configuration for local development and migration deployment.
# Link a hosted project with: supabase link --project-ref <project-ref>

project_id = "sihat-health"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://127.0.0.1:8080"]
enable_signup = true
enable_anonymous_sign_ins = true

[analytics]
enabled = false
